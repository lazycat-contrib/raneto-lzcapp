application:
  subdomain: raneto
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://raneto:3000/
services:
  raneto:
    # upstream: linuxserver/raneto:0.18.1
    image: docker.1ms.run/linuxserver/raneto:0.18.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/config:/config
